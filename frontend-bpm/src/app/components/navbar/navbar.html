<div class="row">
        <nav class="navbar navbar-expand-lg navbar-white bg-light shadow-sm px-3 z-3">

            <a class="navbar-brand d-flex align-items-center" routerLink="/">
            <img [src]="logoUrl" alt="BPM" width="40" height="40" class="me-2">
            <span class="fw-bold fs-4">BPM</span>
            </a>

            <button
            class="navbar-toggler"
            type="button"
            (click)="isMenuCollapsed = !isMenuCollapsed"
            aria-controls="navbarNav"
            aria-label="Toggle navigation">
            <div class="navbar-toggler-icon"></div>
            </button>

            <div class="collapse navbar-collapse"
                id="navbarNav"
                [class.show]="isMenuCollapsed">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                <a class="nav-link"
                    routerLink="/"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: true}"
                    (click)="isMenuCollapsed = true">
                    Home
                </a>
                </li>
                <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
                <button
                    class="btn btn-outline-primary w-100"
                    (click)="runClustering(); isMenuCollapsed = true"
                    [disabled]="isClusteringRunning()">
                    @if (isClusteringRunning()) {
                      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    }
                    {{ isClusteringRunning() ? 'Clustering...' : 'Run Clustering' }}
                </button>
                </li>
            </ul>
            </div>

        </nav>
</div>
