<div class="home-container">
    <!-- Toggle Button for Sidebar (visible on mobile/tablet) -->
    <button
        class="btn btn-primary sidebar-toggle d-lg-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebarOffcanvas"
        aria-controls="sidebarOffcanvas">
        <i class="bi bi-sliders"></i>
        Filtri & Grafici
    </button>

    <div class="row g-0">
        <!-- Map Column -->
        <div class="col-12 col-lg-8 p-3">
            <app-map
                [parkingAreas]="parkingAreas()"
                [parkingEvents]="parkingEvents()"
                [selectedAreaId]="selectedAreaId()"
                [isHeatmapEnabled]="isHeatmapEnabled()"
                [isClusteringEnabled]="isClusteringEnabled()">
            </app-map>
        </div>

        <!-- Sidebar Column (visible on large screens) -->
        <div class="col-lg-4 sidebar-column d-none d-lg-block">
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <app-data-visualization
                        (heatmapToggled)="onHeatmapToggled($event)"
                        (clusteringToggled)="onClusteringToggled($event)">
                    </app-data-visualization>
                </div>
                <div class="sidebar-section">
                    <app-filtersbar
                        [parkingAreas]="parkingAreasList()"
                        (filtersApplied)="onFiltersApplied($event)"
                        (filtersReset)="onFiltersReset()">
                    </app-filtersbar>
                </div>
                <div class="sidebar-section">
                    <app-line-chart [chartData]="chartData()"></app-line-chart>
                </div>
            </div>
        </div>
    </div>

    <!-- Offcanvas Sidebar (visible on mobile/tablet) -->
    <div
        class="offcanvas offcanvas-end d-lg-none"
        tabindex="-1"
        id="sidebarOffcanvas"
        aria-labelledby="sidebarOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Filtri & Grafici</h5>
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close">
            </button>
        </div>
        <div class="offcanvas-body">
            <div class="sidebar-section">
                <app-data-visualization
                    (heatmapToggled)="onHeatmapToggled($event)"
                    (clusteringToggled)="onClusteringToggled($event)">
                </app-data-visualization>
            </div>
            <div class="sidebar-section">
                <app-filtersbar
                    [parkingAreas]="parkingAreasList()"
                    (filtersApplied)="onFiltersApplied($event)"
                    (filtersReset)="onFiltersReset()">
                </app-filtersbar>
            </div>
            <div class="sidebar-section">
                <app-line-chart [chartData]="chartData()"></app-line-chart>
            </div>
        </div>
    </div>
</div>
