<div class="row my-5 mx-3">
    <div class="col d-flex justify-content-center">
        <app-map [parkingAreas]="parkingAreas()" [parkingEvents]="parkingEvents()"></app-map>
    </div>
    <div class="col px-4">
        <div class="row">
            <app-filtersbar
                [parkingAreas]="parkingAreasList()"
                (filtersApplied)="onFiltersApplied($event)"
                (filtersReset)="onFiltersReset()">
            </app-filtersbar>
        </div>
        <div class="row mt-4">
            <app-line-chart [chartData]="chartData()"></app-line-chart>
        </div>
    </div>
</div>
