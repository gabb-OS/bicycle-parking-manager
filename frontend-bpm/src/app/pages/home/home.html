<div class="row my-5 mx-3">
    <div class="col d-flex justify-content-center">
        <app-map
            [parkingAreas]="parkingAreas()"
            [parkingEvents]="parkingEvents()"
            [selectedAreaId]="selectedAreaId()"
            [isHeatmapEnabled]="isHeatmapEnabled()">
        </app-map>
    </div>
    <div class="col px-4">
        <div class="row">
            <app-data-visualization
                (heatmapToggled)="onHeatmapToggled($event)">
            </app-data-visualization>
        </div>
        <div class="row mt-4">
            <app-filtersbar
                [parkingAreas]="parkingAreasList()"
                (filtersApplied)="onFiltersApplied($event)"
                (filtersReset)="onFiltersReset()">
            </app-filtersbar>
        </div>
        <div class="row mt-4">
            <app-line-chart [chartData]="chartData()"></app-line-chart>
        </div>
    </div>
</div>
